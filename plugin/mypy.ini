# The typed surface. core/ is being annotated module by module; a file joins this list once it
# checks clean, so the check never has to be weakened to keep CI green.
[mypy]
python_version = 3.11
ignore_missing_imports = True
files =
    assistants,
    entry,
    core/assistant.py,
    core/hooks,
    core/client_origin.py,
    core/util.py,
